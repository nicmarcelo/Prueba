// Timeline DSL

const scenes = [];
let cursor = 0;
// Global tempo multiplier: the scene script below is authored at a relaxed
// pace and squeezed so the whole piece lands at exactly 60 s.
const SPEED = 0.79;
function scene(fn) {
  const s = { start: cursor, items: [], eraseA: 0, eraseB: 0 };
  let t = cursor;
  const api = {
    text(o) {
      const n = o.text.replace(/\s/g, '').length;
      const dur = (o.dur ?? Math.max(0.5, n * (o.cps ?? 0.07))) * SPEED;
      const delay = (o.delay ?? 0.18) * SPEED;
      s.items.push({ type: 'text', t0: t + delay, dur, x: 540, anchor: 'middle', font: 'caveat', size: 80, color: INK, maxW: 960, ...o });
      t += delay + dur;
      return api;
    },
    draw(o) {
      const dur = (o.dur ?? 1.4) * SPEED;
      const delay = (o.delay ?? 0.18) * SPEED;
      s.items.push({ type: 'draw', t0: t + delay, dur, scale: 1, color: INK, width: 9, fillOpacity: 0.5, ...o });
      t += delay + dur;
      return api;
    },
    wait(d) { t += d; return api; },
    now() { return t; },
    // start the next item at an absolute time (used to overlap elements)
    at(abs) { t = abs; return api; },
  };
  fn(api);
  s.end = t;
  return s;
}
function push(s, hold = 0.35, eraseDur = 0.9, gap = 0.1) {
  s.eraseA = s.end + hold;
  s.eraseB = s.eraseA + eraseDur;
  scenes.push(s);
  cursor = s.eraseB + gap;
}

const DURATION = 60;

// ------------------------------------------------------------------
// Build DOM
// ------------------------------------------------------------------
const stage = document.getElementById('stage');
const scenesG = document.getElementById('scenes');
const defs = stage.querySelector('defs');
const FONT_CLASS = { marker: 'marker', caveat: 'caveat', hand: 'hand' };
const FONT_FAMILY = { marker: "'Permanent Marker'", caveat: "'Caveat'", hand: "'Patrick Hand'" };

// Erase mask path: boustrophedon sweep, stroke 430 wide, rows 400 apart.
const ERASE_D = 'M -320 150 H 1400 V 550 H -320 V 950 H 1400 V 1350 H -320 V 1750 H 1400';

const pens = []; // hand-position intervals: {a, b, pos(u)}
const events = []; // for audio

scenes.forEach((s, si) => {
  const mask = el('mask', { id: 'mask' + si, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H }, defs);
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#fff' }, mask);
  s.maskPath = el('path', { d: ERASE_D, fill: 'none', stroke: '#000', 'stroke-width': 430, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#softMask)' }, mask);
  s.maskLen = s.maskPath.getTotalLength();
  s.maskPath.setAttribute('stroke-dasharray', s.maskLen + ' ' + s.maskLen);
  s.maskPath.setAttribute('stroke-dashoffset', s.maskLen);
  s.g = el('g', { mask: `url(#mask${si})` }, scenesG);

  s.items.forEach(it => {
    if (it.type === 'text') {
      const tx = el('text', {
        x: it.x, y: it.y, 'text-anchor': it.anchor, class: FONT_CLASS[it.font],
        'font-size': it.size, fill: it.color, 'font-family': FONT_FAMILY[it.font],
        'xml:space': 'preserve'
      }, s.g);
      if (it.font === 'caveat') tx.setAttribute('font-weight', '700');
      it.spans = [];
      for (const ch of it.text) {
        const sp = el('tspan', { opacity: 0 }, tx);
        sp.textContent = ch;
        it.spans.push(sp);
      }
      it.el = tx;
    } else {
      const strokes = SHAPES[it.shape];
      const g = el('g', { transform: `translate(${it.x} ${it.y}) scale(${it.scale}) translate(-100 -100)` }, s.g);
      it.el = g;
      it.strokes = strokes.map(st => {
        const p = el('path', {
          d: st.d, fill: st.f || 'none', 'fill-opacity': 0,
          stroke: st.c || it.color, 'stroke-width': (it.width * (st.w ?? 1)) / it.scale,
          'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-opacity': 0.94,
          visibility: 'hidden'
        }, g);
        const len = p.getTotalLength();
        p.setAttribute('stroke-dasharray', len + ' ' + len);
        p.setAttribute('stroke-dashoffset', len);
        return { el: p, len, spec: st };
      });
    }
  });
});

// Layout: fit text widths, compute per-char timings and stroke timings
function layout() {
  for (const s of scenes) for (const it of s.items) {
    if (it.type === 'text') {
      let len = it.el.getComputedTextLength();
      if (len > it.maxW) {
        const size = it.size * it.maxW / len;
        it.el.setAttribute('font-size', size.toFixed(1));
        len = it.el.getComputedTextLength();
      }
      // char timings weighted (spaces are quick)
      const chars = [...it.text];
      const weights = chars.map(c => (c === ' ' ? 0.35 : 1));
      const total = weights.reduce((p, c) => p + c, 0);
      let acc = 0;
      it.chars = chars.map((c, i) => {
        const a = it.t0 + it.dur * acc / total;
        acc += weights[i];
        const b = it.t0 + it.dur * acc / total;
        let pt;
        try { pt = it.el.getEndPositionOfChar(i); } catch (e) { pt = { x: it.x, y: it.y }; }
        const pos = { x: pt.x, y: pt.y - it.size * 0.12 };
        if (c !== ' ') events.push({ kind: 'char', t: a, x: pos.x, y: pos.y });
        return { a, b, pos };
      });
      const first = it.chars[0], lastc = it.chars[it.chars.length - 1];
      pens.push({ a: it.t0, b: it.t0 + it.dur, pos: u => {
        const tt = it.t0 + u * it.dur;
        for (const c of it.chars) if (tt <= c.b) return c.pos;
        return lastc.pos;
      } });
      void first;
    } else {
      const hop = 0.06;
      const n = it.strokes.length;
      const avail = Math.max(0.2, it.dur - hop * (n - 1));
      const wts = it.strokes.map(st => Math.pow(st.len, 0.8) + 4);
      const total = wts.reduce((p, c) => p + c, 0);
      let t = it.t0;
      it.strokes.forEach((st, i) => {
        st.a = t;
        st.b = t + avail * wts[i] / total;
        t = st.b + hop;
        const m = it.el.getCTM ? null : null; void m;
        st.pos = u => {
          const p = st.el.getPointAtLength(u * st.len);
          // local -> stage coordinates
          return { x: it.x + (p.x - 100) * it.scale, y: it.y + (p.y - 100) * it.scale };
        };
        pens.push({ a: st.a, b: st.b, pos: st.pos });
        const p0 = st.pos(0), p1 = st.pos(1);
        events.push({ kind: 'stroke', a: st.a, b: st.b, len: st.len * it.scale, x: p0.x, x1: p1.x });
        if (st.spec.f) events.push({ kind: 'fill', t: st.b, sfx: st.spec.sfx || null, x: p1.x, size: it.scale });
      });
    }
  }
  pens.sort((p, q) => p.a - q.a);
  for (const s of scenes) if (isFinite(s.eraseA)) events.push({ kind: 'erase', a: s.eraseA, b: s.eraseB });
  window.TIMELINE = { duration: DURATION, fps: 30, scenes: scenes.map(s => ({ start: s.start, end: s.end, eraseA: s.eraseA, eraseB: s.eraseB })), events };
}

// ------------------------------------------------------------------
// Hand (marker) and eraser graphics
// ------------------------------------------------------------------
const handG = document.getElementById('handG');
const eraserG = document.getElementById('eraserG');
(function buildHand() {
  const g = el('g', { id: 'handInner', transform: 'rotate(-38) scale(1.3)' }, handG);
  const skin = SKIN, line = '#a86b45';
  // arm / sleeve (goes down-right off screen)
  el('path', { d: 'M -46 212 L -70 640 L 110 640 L 74 212 Z', fill: '#2f6f8f', stroke: '#1f4b61', 'stroke-width': 3 }, g);
  el('path', { d: 'M -44 208 L -50 248 L 78 248 L 72 208 Z', fill: '#e8eef4', stroke: '#9fb0bf', 'stroke-width': 3 }, g);
  // marker body (long enough to show behind the hand)
  el('path', { d: 'M 0 0 L -8 24 L 8 24 Z', fill: '#1d1d1f' }, g);
  el('rect', { x: -14, y: 22, width: 28, height: 44, rx: 5, fill: '#1d1d1f' }, g);
  el('rect', { x: -17, y: 60, width: 34, height: 236, rx: 9, fill: '#2b2b30', stroke: '#111', 'stroke-width': 2 }, g);
  el('rect', { x: -17, y: 72, width: 34, height: 18, fill: PINK }, g);
  el('rect', { x: -17, y: 270, width: 34, height: 18, fill: PINK }, g);
  el('rect', { x: -11, y: 100, width: 6, height: 160, rx: 3, fill: '#4a4a52' }, g);
  // palm
  el('ellipse', { cx: 14, cy: 150, rx: 54, ry: 64, fill: skin, stroke: line, 'stroke-width': 3 }, g);
  // index finger along the marker
  el('ellipse', { cx: -26, cy: 98, rx: 17, ry: 42, fill: skin, stroke: line, 'stroke-width': 3, transform: 'rotate(8 -26 98)' }, g);
  // middle finger wrapped
  el('ellipse', { cx: -22, cy: 140, rx: 18, ry: 34, fill: skin, stroke: line, 'stroke-width': 3, transform: 'rotate(18 -22 140)' }, g);
  // thumb on the other side
  el('ellipse', { cx: 30, cy: 86, rx: 17, ry: 40, fill: skin, stroke: line, 'stroke-width': 3, transform: 'rotate(-28 30 86)' }, g);
  el('path', { d: 'M -8 170 q 14 10 30 4', fill: 'none', stroke: line, 'stroke-width': 2.5, opacity: 0.6 }, g);
  // shadow under the marker tip for depth
  el('ellipse', { cx: 6, cy: 6, rx: 18, ry: 7, fill: '#000', opacity: 0.08 }, handG);
})();
(function buildEraser() {
  const g = el('g', { id: 'eraserInner', transform: 'rotate(-10)' }, eraserG);
  const skin = SKIN, line = '#a86b45';
  // arm from bottom-right
  el('path', { d: 'M 46 -24 L 420 420 L 520 320 L 118 -84 Z', fill: '#2f6f8f', stroke: '#1f4b61', 'stroke-width': 3 }, g);
  // eraser block (long side vertical, moves horizontally)
  el('rect', { x: -52, y: -170, width: 104, height: 340, rx: 14, fill: '#d9dde3', stroke: '#8c929c', 'stroke-width': 3 }, g);
  el('rect', { x: -40, y: -158, width: 80, height: 316, rx: 10, fill: '#3a3f4a' }, g);
  el('rect', { x: -40, y: -158, width: 80, height: 316, rx: 10, fill: 'none', stroke: '#fff', 'stroke-width': 2, opacity: 0.25 }, g);
  // palm on top of block
  el('ellipse', { cx: 10, cy: 10, rx: 62, ry: 92, fill: skin, stroke: line, 'stroke-width': 3, transform: 'rotate(-12 10 10)' }, g);
  // fingers over the far edge
  [-96, -42, 12, 66].forEach((fy, i) => {
    el('ellipse', { cx: -46, cy: fy + 8, rx: 34, ry: 17, fill: skin, stroke: line, 'stroke-width': 3, transform: `rotate(${-8 + i * 2} -46 ${fy + 8})` }, g);
  });
  el('ellipse', { cx: 42, cy: 110, rx: 20, ry: 36, fill: skin, stroke: line, 'stroke-width': 3, transform: 'rotate(30 42 110)' }, g);
  el('ellipse', { cx: 0, cy: 0, rx: 70, ry: 190, fill: '#000', opacity: 0.06 }, eraserG);
})();

const PARK = { x: 1360, y: 2120 };
function handPos(t) {
  // find current / previous / next pen intervals
  let prev = null, next = null;
  for (const p of pens) {
    if (t >= p.a && t <= p.b) return { pos: p.pos((t - p.a) / (p.b - p.a)), show: true };
    if (p.b < t && (!prev || p.b > prev.b)) prev = p;
    if (p.a > t && (!next || p.a < next.a)) next = p;
  }
  const from = prev ? { t: prev.b, pos: prev.pos(1) } : null;
  const to = next ? { t: next.a, pos: next.pos(0) } : null;
  if (from && to) {
    const gap = to.t - from.t;
    if (gap <= 1.2) {
      const u = smooth((t - from.t) / gap);
      return { pos: { x: lerp(from.pos.x, to.pos.x, u), y: lerp(from.pos.y, to.pos.y, u) }, show: true };
    }
    // long gap: leave to park, come back
    if (t < from.t + 0.45) {
      const u = smooth((t - from.t) / 0.45);
      return { pos: { x: lerp(from.pos.x, PARK.x, u), y: lerp(from.pos.y, PARK.y, u) }, show: true };
    }
    if (t > to.t - 0.45) {
      const u = smooth((to.t - t) / 0.45);
      return { pos: { x: lerp(to.pos.x, PARK.x, u), y: lerp(to.pos.y, PARK.y, u) }, show: true };
    }
    return { show: false };
  }
  if (to && t > to.t - 0.5) {
    const u = smooth((to.t - t) / 0.5);
    return { pos: { x: lerp(to.pos.x, PARK.x, u), y: lerp(to.pos.y, PARK.y, u) }, show: true };
  }
  if (from && t < from.t + 0.5) {
    const u = smooth((t - from.t) / 0.5);
    return { pos: { x: lerp(from.pos.x, PARK.x, u), y: lerp(from.pos.y, PARK.y, u) }, show: true };
  }
  return { show: false };
}

// ------------------------------------------------------------------
// render(t)
// ------------------------------------------------------------------
function render(t) {
  let erasing = null;
  for (const s of scenes) {
    const visible = t >= s.start && t < s.eraseB + 0.05;
    s.g.style.display = visible ? '' : 'none';
    if (!visible) continue;
    // erase progress
    if (isFinite(s.eraseA) && t >= s.eraseA) {
      const u = clamp01((t - s.eraseA) / (s.eraseB - s.eraseA));
      s.maskPath.setAttribute('stroke-dashoffset', (s.maskLen * (1 - u)).toFixed(1));
      s.g.setAttribute('opacity', u > 0.8 ? (1 - (u - 0.8) / 0.2).toFixed(3) : 1);
      // the mask stroke has a 215 px round cap ahead of its tip, so the felt
      // block is drawn ahead of the tip in its direction of travel
      const L = u * s.maskLen;
      const p = s.maskPath.getPointAtLength(L);
      const q = s.maskPath.getPointAtLength(Math.min(s.maskLen, L + 2));
      const dir = q.x - p.x > 0.01 ? 1 : q.x - p.x < -0.01 ? -1 : 0;
      erasing = { x: Math.max(-80, Math.min(1160, p.x + dir * 180)), y: p.y, u };
    } else {
      s.maskPath.setAttribute('stroke-dashoffset', s.maskLen);
      s.g.setAttribute('opacity', 1);
    }
    for (const it of s.items) {
      if (it.type === 'text') {
        it.chars.forEach((c, i) => {
          const u = clamp01((t - c.a) / Math.max(0.03, Math.min(0.06, c.b - c.a)));
          it.spans[i].setAttribute('opacity', u.toFixed(3));
        });
      } else {
        for (const st of it.strokes) {
          if (t < st.a) {
            st.el.setAttribute('visibility', 'hidden');
            continue;
          }
          st.el.setAttribute('visibility', 'visible');
          const u = clamp01((t - st.a) / (st.b - st.a));
          st.el.setAttribute('stroke-dashoffset', (st.len * (1 - u)).toFixed(2));
          if (st.spec.f) {
            const fu = clamp01((t - st.b) / 0.35);
            st.el.setAttribute('fill-opacity', (fu * (st.spec.fo ?? it.fillOpacity)).toFixed(3));
          }
        }
      }
    }
  }
  // hand
  const h = erasing ? { show: false } : handPos(t);
  if (h.show) {
    handG.style.display = '';
    const wob = Math.sin(t * 9.0) * 1.2;
    handG.setAttribute('transform', `translate(${h.pos.x.toFixed(1)} ${h.pos.y.toFixed(1)}) rotate(${wob.toFixed(2)})`);
  } else handG.style.display = 'none';
  if (erasing) {
    eraserG.style.display = '';
    const bob = Math.sin(erasing.u * 60) * 6;
    eraserG.setAttribute('transform', `translate(${erasing.x.toFixed(1)} ${(erasing.y + bob).toFixed(1)})`);
  } else eraserG.style.display = 'none';
}

window.render = render;
window.ready = (async () => {
  await Promise.all([
    document.fonts.load("100px 'Permanent Marker'"),
    document.fonts.load("700 100px 'Caveat'"),
    document.fonts.load("100px 'Patrick Hand'"),
  ]);
  await document.fonts.ready;
  layout();
  render(0);
  return true;
})();

// Live preview when opened in a browser (press space to pause, arrows to seek)
if (!navigator.webdriver) {
  let t0 = performance.now(), paused = false, offset = 0;
  const loop = () => {
    if (!paused) {
      const t = ((performance.now() - t0) / 1000 + offset) % (DURATION + 1);
      render(t);
    }
    requestAnimationFrame(loop);
  };
  window.ready.then(() => requestAnimationFrame(loop));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) { t0 = performance.now(); } else { offset = ((performance.now() - t0) / 1000 + offset); } }
    if (e.code === 'ArrowRight') { offset += 2; }
    if (e.code === 'ArrowLeft') { offset -= 2; }
  });
}
})();
</script>
</body>
